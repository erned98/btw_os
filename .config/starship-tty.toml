add_newline = true
command_timeout = 200
format = "[$directory$git_branch$git_status]($style)$character"
right_format = "[$battery$time]($style)"
[character]
error_symbol = "[X](bright-red)"
success_symbol = "[>](bright-green)"

[directory]
truncation_length = 2
truncation_symbol = "…/"
repo_root_style = "bright-cyan"
repo_root_format = "[$repo_root]($repo_root_style)[$path]($style)[$read_only]($read_only_style) "
read_only = " RO"
read_only_style = "bright-red"

[git_branch]
format = "[$branch]($style) "
style = "bright-yellow"

[git_status]
format     = '[$all_status]($style)'
style      = "bright-yellow"
ahead      = ">${count} "
diverged   = ">${ahead_count}<${behind_count} "
behind     = "<${count} "
conflicted = "="
up_to_date = ""
untracked  = "?"
modified   = "!"
stashed    = ""
staged     = ""
renamed    = ""
deleted    = ""                                                           

[battery]
format = '$symbol [$percentage]($style) '
full_symbol = "bat"
charging_symbol = "[chr](bright-green)"
discharging_symbol = "bat"
unknown_symbol = "bat ?"
empty_symbol = "bat !"

[[battery.display]]
threshold = 25
style = "bright-red"

[[battery.display]]
threshold = 50
style = "bright-yellow"

[[battery.display]]
threshold = 100
style = "bright-green"

[time]
disabled = false
format = '$time'
time_format = '%R'
utc_time_offset = 'local'
